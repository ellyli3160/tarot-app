<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔮 神秘塔羅 - 探索內心智慧</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@600&family=Noto+Serif+TC:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Serif TC', 'Microsoft JhengHei', serif;
            font-weight: 600;
            background-color: #FFF4EA;
            background-image: url('Gradient.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            color: #333;
            overflow-x: hidden;
            position: relative;
        }

        /* body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('Texture.svg');
            background-repeat: repeat;
            background-size: auto;
            opacity: 0.6;
            pointer-events: none;
            z-index: 0;
        } */

        .container {
            position: relative;
            z-index: 1;
        }

        /* 主容器 */
        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
        }

        /* 標題區域 */
        .header {
            text-align: left;
            margin-bottom: 60px;
        }

        .title {
            font-size: 4rem;
            color: #2d2d2d;
            margin-bottom: 5px;
            font-family: 'Abhaya Libre', serif;
            font-weight: 600;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #6d6d6d;
            font-size: 1.1rem;
            font-family: 'Abhaya Libre', serif;
            font-weight: 600;
        }

        /* 主要內容區域 */
        .main-content {
            display: block;
        }

        /* 輸入區域 */
        .input-section {
            margin-bottom: 40px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        /* 模式選擇 */
        .mode-selection {
            display: flex;
            gap: 15px;
            margin-bottom: 35px;
        }

        .mode-option {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #2d2d2d;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: transparent;
            color: #2d2d2d;
            font-size: 1rem;
            font-weight: 600;
        }

        .mode-option.active {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-color: #2d2d2d;
        }

        .mode-option:hover {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            transform: translateY(-2px);
        }

        /* 抽牌數選擇 */
        .card-count-section {
            display: none;
        }

        .card-count-section.show {
            display: block;
        }

        .card-count-options {
            display: flex;
            gap: 12px;
            margin-bottom: 35px;
        }

        .card-option {
            flex: 1;
            padding: 18px;
            border: 2px solid #2d2d2d;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            background: transparent;
            font-size: 1.1rem;
            font-weight: 600;
            color: #2d2d2d;
        }

        .card-option.active {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-color: #2d2d2d;
        }

        .card-option:hover {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
        }

        /* 問題輸入框 */
        .form-group textarea {
            width: 100%;
            padding: 20px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            resize: vertical;
            min-height: 150px;
            font-family: 'Noto Serif TC', serif;
            font-weight: 600;
            color: #2d2d2d;
        }

        .form-group textarea::placeholder {
            color: #999;
        }

        .form-group textarea:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.95);
        }

        /* 按鈕 */
        .submit-btn {
            display: block;
            margin: 0 auto;
            padding: 15px 50px;
            background: #FFBDCD;
            color: #2d2d2d;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            font-family: 'Noto Serif TC', serif;
            cursor: pointer;
            transition: all 0.3s;
        }

        .submit-btn:hover {
            background: #ffabc0;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 189, 205, 0.4);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .submit-btn .btn-text {
            position: relative;
            z-index: 2;
        }

        /* 載入動畫 - 全螢幕蓋板 */
        .loading {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 244, 234, 0.95);
            backdrop-filter: blur(10px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .loading.show {
            display: flex;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 189, 205, 0.3);
            border-top: 4px solid #FFBDCD;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading h3 {
            color: #2d2d2d;
            margin-bottom: 10px;
            font-family: 'Noto Serif TC', serif;
            font-weight: 600;
        }

        .loading p {
            color: #6d6d6d;
            font-family: 'Noto Serif TC', serif;
            font-weight: 600;
        }

        /* 結果區域 */
        .result-section {
            display: none;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
        }

        .result-section.show {
            display: block;
        }

        .result-content {
            display: none;
            width: 100%;
        }

        .result-content.show {
            display: block;
        }

        /* 抽牌結果 */
        .cards-display {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin: 25px 0;
            justify-content: center;
        }

        .tarot-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: none;
            border-radius: 12px;
            padding: 25px 20px;
            text-align: center;
            min-width: 150px;
            flex: 1;
            max-width: 200px;
            transition: all 0.3s;
        }

        .tarot-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.8);
        }

        .card-number {
            background: #FFB5C5;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .card-name {
            font-size: 1.3rem;
            font-weight: 600;
            color: #2d2d2d;
            margin-bottom: 12px;
        }

        .card-meta {
            font-size: 0.95rem;
            color: #6d6d6d;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .card-meaning {
            color: #4a4a4a;
            font-size: 0.9rem;
            line-height: 1.6;
            font-weight: 600;
        }

        /* 解讀區域 */
        .interpretation {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 12px;
        }

        /* Markdown 樣式支援 */
        .interpretation h1,
        .interpretation h2,
        .interpretation h3 {
            color: #2d2d2d;
            margin-top: 20px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .interpretation h1:first-child,
        .interpretation h2:first-child,
        .interpretation h3:first-child {
            margin-top: 0;
        }

        .interpretation h1 { font-size: 2rem; }
        .interpretation h2 { font-size: 1.6rem; }
        .interpretation h3 { font-size: 1.3rem; }

        .interpretation p {
            margin-bottom: 12px;
            line-height: 1.8;
        }

        .interpretation ul,
        .interpretation ol {
            margin-left: 25px;
            margin-bottom: 15px;
            padding-left: 10px;
        }

        .interpretation ol {
            list-style-type: decimal;
        }

        .interpretation ul {
            list-style-type: disc;
        }

        .interpretation li {
            margin-bottom: 8px;
            line-height: 1.6;
            padding-left: 5px;
        }

        .interpretation strong {
            font-weight: 600;
            color: #2d2d2d;
        }

        .interpretation em {
            font-style: italic;
            color: #4a4a4a;
        }

        .interpretation blockquote {
            border-left: 4px solid #FFBDCD;
            padding-left: 20px;
            margin: 15px 0;
            color: #6d6d6d;
            font-style: italic;
        }

        .interpretation code {
            background: rgba(255, 255, 255, 0.8);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            color: #2d2d2d;
        }

        .interpretation pre {
            background: rgba(255, 255, 255, 0.8);
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 15px 0;
        }

        .interpretation h4 {
            color: #2d2d2d;
            margin-bottom: 15px;
            margin-top: 15px;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .interpretation hr {
            border: none;
            border-top: 2px solid rgba(255, 189, 205, 0.5);
            margin: 20px 0;
        }

        /* 詳細信息 */
        .result-meta {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid rgba(45, 45, 45, 0.1);
        }

        .meta-item {
            background: rgba(255, 189, 205, 0.2);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .meta-label {
            font-size: 0.9rem;
            color: #6d6d6d;
            margin-bottom: 5px;
        }

        .meta-value {
            font-weight: bold;
            color: #2d2d2d;
        }

        /* 錯誤提示 */
        .error {
            background: rgba(254, 215, 215, 0.85);
            backdrop-filter: blur(10px);
            border: 2px solid #f56565;
            border-radius: 12px;
            padding: 20px;
            color: #c53030;
            text-align: center;
            margin: 20px 0;
        }

        /* 按鈕容器 */
        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .action-buttons .submit-btn {
            flex: 0 1 auto;
            margin: 0;
        }

        .btn-secondary {
            background: #e0e0e0 !important;
            color: #2d2d2d !important;
        }

        /* 響應式設計 */
        @media (max-width: 768px) {
            .title {
                font-size: 2.5rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .container {
                padding: 20px 15px;
            }

            .header {
                margin-bottom: 40px;
            }

            .mode-selection {
                flex-direction: column;
                gap: 10px;
            }

            .mode-option {
                padding: 12px 15px;
                font-size: 0.95rem;
            }

            .card-count-options {
                gap: 8px;
            }

            .card-option {
                padding: 12px;
                font-size: 1rem;
            }

            .form-group textarea {
                padding: 15px;
                font-size: 16px;
                min-height: 120px;
            }

            .submit-btn {
                width: 100%;
                padding: 12px 30px;
                font-size: 1rem;
            }

            .result-section {
                padding: 20px 15px;
            }

            .cards-display {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }

            .tarot-card {
                max-width: 100%;
                padding: 20px 15px;
            }

            .card-name {
                font-size: 1.2rem;
            }

            .interpretation {
                padding: 20px 15px;
            }

            .interpretation h1 { font-size: 1.5rem; }
            .interpretation h2 { font-size: 1.3rem; }
            .interpretation h3 { font-size: 1.1rem; }
            .interpretation h4 { font-size: 1rem; }

            .result-meta {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .meta-item {
                padding: 12px;
            }

            .meta-label {
                font-size: 0.85rem;
            }

            .meta-value {
                font-size: 0.9rem;
            }

            .action-buttons {
                flex-direction: column;
                gap: 10px;
            }

            .action-buttons .submit-btn {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            .title {
                font-size: 2rem;
            }

            .subtitle {
                font-size: 0.9rem;
            }

            .container {
                padding: 15px 10px;
            }

            .card-count-options {
                gap: 6px;
            }

            .card-option {
                padding: 10px;
                font-size: 0.9rem;
            }

            .submit-btn {
                padding: 10px 25px;
                font-size: 0.95rem;
            }

            .interpretation {
                padding: 15px 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 標題區域 -->
        <div class="header">
            <h1 class="title">Tarot</h1>
            <p class="subtitle">Trust yourself.</p>
        </div>

        <!-- 主要內容 -->
        <div class="main-content">
            <!-- 輸入區域 -->
            <div class="input-section">
                <form id="tarotForm">
                    <div class="form-group">
                        <div class="mode-selection">
                            <div class="mode-option active" data-mode="ai-suggest">
                                AI推薦
                            </div>
                            <div class="mode-option" data-mode="auto">
                                自選牌數
                            </div>
                        </div>
                    </div>

                    <div class="form-group card-count-section">
                        <div class="card-count-options">
                            <div class="card-option active" data-count="1">1</div>
                            <div class="card-option" data-count="2">2</div>
                            <div class="card-option" data-count="3">3</div>
                            <div class="card-option" data-count="4">4</div>
                            <div class="card-option" data-count="5">5</div>
                        </div>
                    </div>

                    <div class="form-group">
                        <textarea id="question" rows="5" placeholder="請詳細輸入您的問題" required></textarea>
                    </div>

                    <button type="submit" class="submit-btn">
                        <span class="btn-text">送出</span>
                    </button>
                </form>
            </div>

            <!-- 結果區域 -->
            <div class="result-section" id="resultSection">
                <div id="resultDetails"></div>
            </div>
        </div>
        
        <!-- 載入動畫 -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <h3>正在為您抽牌...</h3>
            <p>宇宙正在為您準備答案，請稍候...</p>
        </div>
    </div>

    <script>
        // 配置 marked.js
        if (typeof marked !== 'undefined') {
            marked.setOptions({
                breaks: true,
                gfm: true
            });
        }

        // === Session 管理 ===
        const SESSION_KEY = 'tarot_session';

        function createSession() {
            return {
                sessionId: generateUUID(),
                createdAt: new Date().toISOString(),
                initialQuestion: '',  // 第一次占卜的問題
                currentQuestion: '',
                drawnCardNames: [],
                drawnCards: [],
                interpretation: '',
                totalDrawn: 0
            };
        }

        function getSession() {
            const stored = localStorage.getItem(SESSION_KEY);
            return stored ? JSON.parse(stored) : null;
        }

        function saveSession(session) {
            localStorage.setItem(SESSION_KEY, JSON.stringify(session));
        }

        function clearSession() {
            localStorage.removeItem(SESSION_KEY);
        }

        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
                const r = Math.random() * 16 | 0;
                const v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        // API 配置 - Zeabur 部署的 API
        const API_URL = 'https://ellyli3160.zeabur.app/webhook/tarot-game';
        
        // 模式選擇
        document.querySelectorAll('.mode-option').forEach(option => {
            option.addEventListener('click', function() {
                document.querySelectorAll('.mode-option').forEach(o => o.classList.remove('active'));
                this.classList.add('active');
                
                const cardCountSection = document.querySelector('.card-count-section');
                if (this.dataset.mode === 'auto') {
                    cardCountSection.classList.add('show');
                } else {
                    cardCountSection.classList.remove('show');
                }
            });
        });
        
        // 抽牌數量選擇
        document.querySelectorAll('.card-option').forEach(option => {
            option.addEventListener('click', function() {
                document.querySelectorAll('.card-option').forEach(o => o.classList.remove('active'));
                this.classList.add('active');
            });
        });
        
        // 表單提交
        document.getElementById('tarotForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const question = document.getElementById('question').value;
            const mode = document.querySelector('.mode-option.active').dataset.mode;
            const cardCount = document.querySelector('.card-option.active')?.dataset.count;

            // 取得或建立 session
            let session = getSession();
            if (!session) {
                session = createSession();
            }

            // 準備請求數據（新增 session 相關參數）
            const requestData = {
                mode: mode,
                question: question,
                sessionId: session.sessionId,
                previousCards: session.drawnCardNames,
                previousQuestion: session.currentQuestion,
                previousInterpretation: session.interpretation
            };

            if (mode === 'auto' && cardCount) {
                requestData.cardCount = parseInt(cardCount);
            }

            // 顯示載入動畫
            showLoading();

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(requestData)
                });

                const data = await response.json();

                if (data.success) {
                    // 更新 session
                    const newCardNames = data.result.drawnCards.map(card => {
                        // 移除「（正位）」「（逆位）」後綴
                        return card.name.replace(/[（(](正位|逆位)[）)]/g, '').trim();
                    });

                    // 如果是第一次占卜，保存初始問題
                    if (!session.initialQuestion) {
                        session.initialQuestion = question;
                    }

                    session.currentQuestion = question;
                    session.drawnCards = data.result.drawnCards;
                    session.drawnCardNames.push(...newCardNames);
                    session.interpretation = data.result.interpretation;
                    session.totalDrawn += data.result.cardCount;

                    saveSession(session);
                    // 確保 question 欄位存在（防止 API 未返回）
                    if (!data.result.question) {
                        data.result.question = question;
                    }
                    displayResult(data.result, session);
                } else {
                    throw new Error('占卜失敗');
                }
            } catch (error) {
                displayError('占卜過程中發生錯誤: ' + error.message);
            } finally {
                hideLoading();
            }
        });
        
        function showLoading() {
            document.getElementById('loading').classList.add('show');
            document.getElementById('resultSection').classList.remove('show');
        }
        
        function hideLoading() {
            document.getElementById('loading').classList.remove('show');
        }
        
        function displayResult(result, session) {
            const resultSection = document.getElementById('resultSection');
            const resultDetails = document.getElementById('resultDetails');

            let cardsHtml = '';
            result.drawnCards.forEach((card, index) => {
                const orientationClass = card.isReversed ? 'reversed' : 'upright';
                cardsHtml += `
                    <div class="tarot-card ${orientationClass}">
                        <div class="card-number">${card.drawOrder}</div>
                        <div class="card-name">${card.name}</div>
                        <div class="card-meta">${card.orientation}｜${card.position}</div>
                        <div class="card-meaning">${card.meaning}</div>
                    </div>
                `;
            });

            // 處理 AI 解讀文本，使用 Markdown 解析
            const interpretation = result.interpretation || '暫無解讀內容';
            const formattedInterpretation = marked.parse(interpretation);

            // 初始問題提示（如果不是第一次占卜）
            const initialQuestionHtml = session.initialQuestion && session.initialQuestion !== result.question ? `
                <div style="background: rgba(255, 189, 205, 0.2); padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #FFBDCD;">
                    <strong style="color: #2d2d2d;">📋 初始問題：</strong><br>
                    <span style="color: #4a4a4a;">${session.initialQuestion}</span>
                </div>
            ` : '';

            resultDetails.innerHTML = `
                ${initialQuestionHtml}

                <div style="text-align: center; margin-bottom: 20px;">
                    <strong style="color: #2d3748;">問題:</strong> ${result.question}<br>
                    <strong style="color: #2d3748;">模式:</strong> ${result.mode === 'auto' ? '自選抽牌' : 'AI智能建議'}<br>
                    <strong style="color: #2d3748;">抽牌數:</strong> ${result.cardCount}張
                </div>

                <div class="cards-display">
                    ${cardsHtml}
                </div>

                <div class="interpretation">
                    <div>${formattedInterpretation}</div>
                </div>

                <div class="result-meta">
                    <div class="meta-item">
                        <div class="meta-label">占卜時間</div>
                        <div class="meta-value">${new Date(result.timestamp).toLocaleString('zh-TW')}</div>
                    </div>
                    <div class="meta-item">
                        <div class="meta-label">記錄編號</div>
                        <div class="meta-value">${result.drawId}</div>
                    </div>
                    ${result.summary ? `
                    <div class="meta-item">
                        <div class="meta-label">牌面分布</div>
                        <div class="meta-value">正位 ${result.summary.upright}張 / 逆位 ${result.summary.reversed}張</div>
                    </div>
                    ` : ''}
                    <div class="meta-item">
                        <div class="meta-label">累計抽牌</div>
                        <div class="meta-value">${session.totalDrawn} / 78 張</div>
                    </div>
                </div>

                <!-- 繼續提問按鈕 -->
                <div class="action-buttons">
                    <button id="continueBtn" class="submit-btn">
                        繼續提問
                    </button>
                    <button id="newSessionBtn" class="submit-btn btn-secondary">
                        開始新占卜
                    </button>
                </div>
            `;

            // 顯示結果
            resultSection.classList.add('show');

            // 按鈕事件監聽
            document.getElementById('continueBtn').addEventListener('click', () => {
                // 清空問題輸入框
                document.getElementById('question').value = '';
                // 捲動到表單
                document.querySelector('.main-content').scrollIntoView({ behavior: 'smooth' });
                // 聚焦輸入框
                document.getElementById('question').focus();
            });

            document.getElementById('newSessionBtn').addEventListener('click', () => {
                if (confirm('確定要開始新的占卜嗎？這將清除目前的記錄。')) {
                    clearSession();
                    location.reload();
                }
            });
        }
        
        function displayError(message) {
            const resultSection = document.getElementById('resultSection');
            const resultDetails = document.getElementById('resultDetails');

            resultDetails.innerHTML = `
                <div class="error">
                    <h3>❌ 占卜失敗</h3>
                    <p>${message}</p>
                    <p style="margin-top: 10px;">請檢查網路連接後重試，或稍後再試。</p>
                </div>
            `;

            resultSection.classList.add('show');
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 頁面載入完成
        });
    </script>
</body>
</html>
